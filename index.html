<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HexPolitics: Stone Age v6.2</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: #0f172a; color: #fff; user-select: none; -webkit-user-select: none; }

        #update-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; display: flex; justify-content: center; align-items: center; z-index: 2000; transition: opacity 0.5s ease; }
        .loader-content { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 20px; }
        .spinner { width: 50px; height: 50px; border: 5px solid #334155; border-top: 5px solid #38bdf8; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loader-content h2 { color: #f8fafc; font-size: 22px; }
        .loader-content p { color: #94a3b8; font-size: 14px; }

        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1e293b; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .auth-box { background: #334155; padding: 25px; border-radius: 12px; width: 300px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 12px; }
        .auth-box h2 { text-align: center; color: #38bdf8; font-size: 22px; letter-spacing: 1px; }
        .auth-box input { padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: #fff; outline: none; font-size: 14px; }
        .auth-box button { padding: 10px; border-radius: 6px; border: none; background: #3b82f6; color: #fff; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .auth-box button:hover { background: #2563eb; }
        .auth-toggle { text-align: center; font-size: 12px; color: #94a3b8; cursor: pointer; margin-top: 3px; }
        .auth-toggle:hover { color: #38bdf8; text-decoration: underline; }

        #game-container { display: none; height: 100vh; width: 100vw; position: relative; overflow: hidden; background: #0b132b; }
        #hex-grid-viewport { width: 100%; height: 100%; overflow: hidden; cursor: grab; position: relative; touch-action: none; }
        #hex-grid-viewport:active { cursor: grabbing; }
        #hex-canvas { display: block; position: absolute; top: 0; left: 0; }

        #user-bar { position: absolute; top: 10px; left: 10px; right: 10px; background: rgba(30, 41, 59, 0.95); padding: 8px 12px; border-radius: 10px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; z-index: 500; box-shadow: 0 4px 15px rgba(0,0,0,0.4); backdrop-filter: blur(5px); font-size: 13px; }
        .user-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .gold-display { background: rgba(245, 158, 11, 0.15); border: 1px solid #f59e0b; padding: 3px 8px; border-radius: 6px; font-weight: bold; color: #fbbf24; display: flex; align-items: center; gap: 4px; font-size: 12px; }
        .user-actions { display: flex; gap: 6px; align-items: center; }
        #user-bar button { padding: 5px 10px; border-radius: 6px; border: none; background: #ef4444; color: #fff; font-weight: bold; cursor: pointer; font-size: 11px; transition: background 0.2s; }
        #user-bar button:hover { background: #dc2626; }

        .modal { display: none; position: fixed; background: #1e293b; border: 2px solid #38bdf8; border-radius: 12px; padding: 20px; z-index: 1500; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; width: 340px; max-width: calc(100vw - 30px); max-height: 80vh; overflow-y: auto; top: 50%; right: 15px; transform: translateY(-50%); }
        .modal h3 { margin-bottom: 10px; color: #38bdf8; font-size: 18px; }
        .modal-btns { display: flex; gap: 8px; justify-content: center; flex-direction: column; margin-top: 10px; }
        .modal-btns button { padding: 10px 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-size: 13px; width: 100%; }
        .btn-confirm { background: #10b981; color: #fff; }
        .btn-cancel { background: #64748b; color: #fff; }

        #zoom-controls { position: absolute; bottom: 15px; right: 15px; display: flex; flex-direction: column; gap: 6px; z-index: 500; }
        #zoom-controls button { width: 40px; height: 40px; border-radius: 8px; border: 1px solid #475569; background: rgba(30, 41, 59, 0.95); color: #fff; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
    </style>
</head>
<body>

    <div id="update-loader">
        <div class="loader-content">
            <div class="spinner"></div>
            <h2 id="loader-status">HexPolitics: Stone Age</h2>
            <p id="loader-desc">Завантаження первовічного світу...</p>
        </div>
    </div>

    <div id="auth-screen">
        <div class="auth-box">
            <h2>Stone Age</h2>
            <input type="text" id="username" placeholder="Логін племені">
            <input type="password" id="password" placeholder="Пароль">
            <button id="auth-btn" onclick="handleAuth()">Увійти</button>
            <div class="auth-toggle" id="auth-toggle-mode" onclick="switchAuthMode('register')">Створити нове плем'я</div>
        </div>
    </div>

    <div id="game-container">
        <div id="user-bar">
            <div class="user-left">
                <span>Вождь: <b id="current-user-display" style="color: #38bdf8;">---</b></span>
                <div class="gold-display">🍖 Їжа/Ресурси: <span id="user-gold-display">0</span></div>
            </div>
            <div class="user-actions">
                <button onclick="logout()">Вийти</button>
            </div>
        </div>

        <div id="hex-grid-viewport">
            <canvas id="hex-canvas"></canvas>
        </div>

        <div id="zoom-controls">
            <button onclick="zoomIn()" title="Наблизити">+</button>
            <button onclick="zoomOut()" title="Віддалити">−</button>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, child, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDrQeerlWPJ0d_gZ3acvW54FQmihdAQqK4",
            authDomain: "kovel-game.firebaseapp.com",
            databaseURL: "https://kovel-game-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "kovel-game",
            storageBucket: "kovel-game.firebasestorage.app",
            messagingSenderId: "1028978690479",
            appId: "1:1028978690479:web:c37e96a9b07175d325c75a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ===== КОНСТАНТИ КАМ'ЯНОГО ВІКУ =====
        const CURRENT_VERSION = "6.2.0";
        const GRID_ROWS = 25;
        const GRID_COLS = 25;
        const HEX_RADIUS = 26;
        const STATIC_SSAA = 1; // Оптимізація швидкодії без зайвого масштабування

        // ===== СТАН ГРИ =====
        let mode = "login";
        let currentUsername = "";
        let userResources = 0;
        let hexWorldData = {};
        let gameLoopInterval = null;
        let unsubWorld = null;
        let unsubUser = null;
        let gameLoopBusy = false;

        let canvas = null, ctx = null, dpr = 1, viewW = 0, viewH = 0;
        let scale = 0.75, panX = 0, panY = 0;
        let staticCanvas = null, staticCtx = null, staticWorldW = 0, staticWorldH = 0, staticDirty = true;
        let playerColorCache = {};
        let pathCache = new Map();
        let hoveredHex = null;
        let isDragging = false, dragStartX = 0, dragStartY = 0, dragMoved = false, isClick = true;
        const activePointers = new Map();
        let renderScheduled = false, rafHandle = 0;

        function invalidateColorCache() { playerColorCache = {}; }
        function invalidatePathCache() { pathCache.clear(); }

        function generateUnitId() {
            return 'u_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        }

        function getPlayerColor(username) {
            if (playerColorCache[username]) return playerColorCache[username];
            let color = '#3b82f6';
            for (const k in hexWorldData) {
                const h = hexWorldData[k];
                if (h.owner === username && h.color) { color = h.color; break; }
            }
            playerColorCache[username] = color;
            return color;
        }

        // ===== ГЕОМЕТРІЯ ГЕКСІВ =====
        function hexToPixel(r, c) {
            return {
                x: HEX_RADIUS * Math.sqrt(3) * (c + 0.5 * (r & 1)) + HEX_RADIUS,
                y: HEX_RADIUS * 1.5 * r + HEX_RADIUS
            };
        }

        function getNeighbors(r, c) {
            const isOdd = r & 1;
            const directions = isOdd
                ? [{ r: -1, c: 0 }, { r: -1, c: 1 }, { r: 0, c: -1 }, { r: 0, c: 1 }, { r: 1, c: 0 }, { r: 1, c: 1 }]
                : [{ r: -1, c: -1 }, { r: -1, c: 0 }, { r: 0, c: -1 }, { r: 0, c: 1 }, { r: 1, c: -1 }, { r: 1, c: 0 }];
            const neighbors = [];
            for (const d of directions) {
                const nr = r + d.r, nc = c + d.c;
                if (nr >= 0 && nr < GRID_ROWS && nc >= 0 && nc < GRID_COLS) {
                    neighbors.push({ r: nr, c: nc, key: `${nr}_${nc}` });
                }
            }
            return neighbors;
        }

        function pixelToHex(px, py) {
            const R = HEX_RADIUS;
            const x = px - R, y = py - R;
            const q = (Math.sqrt(3) / 3 * x - 1 / 3 * y) / R;
            const rr = (2 / 3 * y) / R;
            const s = -q - rr;
            let rq = Math.round(q), rr2 = Math.round(rr), rs = Math.round(s);
            const dq = Math.abs(rq - q), dr = Math.abs(rr2 - rr), ds = Math.abs(rs - s);
            if (dq > dr && dq > ds) rq = -rr2 - rs;
            else if (dr > ds) rr2 = -rq - rs;
            const col = rq + (rr2 - (rr2 & 1)) / 2;
            const row = rr2;
            if (row < 0 || row >= GRID_ROWS || col < 0 || col >= GRID_COLS) return null;
            return { r: row, c: col };
        }

        function pathHex(g, cx, cy, radius) {
            g.beginPath();
            for (let i = 0; i < 6; i++) {
                const a = Math.PI / 180 * (60 * i - 30);
                const x = cx + radius * Math.cos(a);
                const y = cy + radius * Math.sin(a);
                if (i === 0) g.moveTo(x, y);
                else g.lineTo(x, y);
            }
            g.closePath();
        }

        function hideLoader() {
            const l = document.getElementById('update-loader');
            if (!l) return;
            l.style.opacity = '0';
            setTimeout(() => l.style.display = 'none', 500);
        }
        // ===== АВТОРИЗАЦІЯ ТА СЕСІЯ =====
        window.switchAuthMode = function(targetMode) {
            mode = targetMode;
            const btn = document.getElementById('auth-btn');
            const toggleMode = document.getElementById('auth-toggle-mode');

            if (mode === 'login') {
                btn.innerText = 'Увійти';
                toggleMode.innerText = "Створити нове плем'я";
                toggleMode.setAttribute('onclick', "switchAuthMode('register')");
            } else if (mode === 'register') {
                btn.innerText = "Заснувати плем'я";
                toggleMode.innerText = 'Вже є плем\'я? Увійти';
                toggleMode.setAttribute('onclick', "switchAuthMode('login')");
            }
        }

        window.handleAuth = async function() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if (!user || !pass) { alert("Заповніть усі поля!"); return; }
            const dbRef = ref(db);

            try {
                if (mode === 'register') {
                    const snapshot = await get(child(dbRef, `users/${user}`));
                    if (snapshot.exists()) { alert("Плем'я з таким ім'ям вже існує!"); return; }
                    
                    await set(ref(db, 'users/' + user), { 
                        password: pass, 
                        resources: 50, 
                        lastOnline: Date.now() 
                    });
                    alert("Плем'я успішно засновано!");
                    switchAuthMode('login');
                } else if (mode === 'login') {
                    const snapshot = await get(child(dbRef, `users/${user}`));
                    if (!snapshot.exists() || snapshot.val().password !== pass) { 
                        alert("Невірне ім'я племені або пароль!"); 
                        return; 
                    }

                    currentUsername = user;
                    const userData = snapshot.val();
                    const worldSnap = await get(child(dbRef, 'world_hexes'));
                    hexWorldData = worldSnap.exists() ? worldSnap.val() : {};
                    invalidateColorCache();

                    document.getElementById('auth-screen').style.display = 'none';
                    document.getElementById('game-container').style.display = 'block';
                    document.getElementById('current-user-display').innerText = user;

                    initCanvas();
                    setupViewportControls();
                    listenToWorldData();
                    listenToUserData();
                    startGameLoop();
                }
            } catch (error) { alert('Помилка авторизації: ' + error.message); }
        }

        window.logout = async function() {
            if (currentUsername) {
                try { await update(ref(db, `users/${currentUsername}`), { lastOnline: Date.now() }); } catch (e) {}
            }
            if (gameLoopInterval) clearInterval(gameLoopInterval);
            if (unsubWorld) unsubWorld();
            if (unsubUser) unsubUser();
            currentUsername = "";
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('auth-screen').style.display = 'flex';
        }
        // ===== СЛУХАЧІ ДАНИХ ТА ІГРОВИЙ ЦИКЛ =====
        function listenToWorldData() {
            if (unsubWorld) unsubWorld();
            unsubWorld = onValue(ref(db, 'world_hexes'), (snapshot) => {
                hexWorldData = snapshot.exists() ? snapshot.val() : {};
                staticDirty = true;
                scheduleRender();
            });
        }

        function listenToUserData() {
            if (unsubUser) unsubUser();
            unsubUser = onValue(ref(db, `users/${currentUsername}`), (snapshot) => {
                if (!snapshot.exists()) return;
                const data = snapshot.val();
                userResources = Math.floor(data.resources || 0);
                const gEl = document.getElementById('user-gold-display');
                if (gEl) gEl.innerText = userResources;
            });
        }

        function startGameLoop() {
            if (gameLoopInterval) clearInterval(gameLoopInterval);
            gameLoopInterval = setInterval(async () => {
                if (!currentUsername || gameLoopBusy) return;
                gameLoopBusy = true;
                try {
                    // Логіка оновлення подій первовічного світу
                } catch (err) { console.error('Помилка ігрового циклу:', err); }
                finally { gameLoopBusy = false; }
            }, 3000);
        }
        // ===== CANVAS РЕНДЕР-ЯДРО (60 FPS) =====
        function initCanvas() {
            canvas = document.getElementById('hex-canvas');
            if (!canvas) return;
            ctx = canvas.getContext('2d', { alpha: false });
            
            ctx.imageSmoothingEnabled = true;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            staticCanvas = document.createElement('canvas');
            staticCtx = staticCanvas.getContext('2d', { alpha: true });
            
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            staticDirty = true;
            scheduleRender();
        }

        function resizeCanvas() {
            const vp = document.getElementById('hex-grid-viewport');
            if (!vp || !canvas) return;
            viewW = vp.clientWidth;
            viewH = vp.clientHeight;
            dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));

            canvas.width = Math.round(viewW * dpr);
            canvas.height = Math.round(viewH * dpr);
            canvas.style.width = viewW + 'px';
            canvas.style.height = viewH + 'px';
            staticDirty = true;
            scheduleRender();
        }

        function scheduleRender() {
            if (renderScheduled) return;
            renderScheduled = true;
            rafHandle = requestAnimationFrame(renderFrame);
        }

        function renderFrame(ts) {
            renderScheduled = false;
            if (!ctx || !canvas) return;

            if (staticDirty) rebuildStaticLayer();

            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = '#0b132b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.setTransform(
                dpr * scale, 0,
                0, dpr * scale,
                dpr * panX, dpr * panY
            );

            if (staticCanvas && staticWorldW > 0) {
                ctx.drawImage(staticCanvas, 0, 0, staticWorldW, staticWorldH);
            }

            rafHandle = requestAnimationFrame(renderFrame);
        }

        function rebuildStaticLayer() {
            staticDirty = false;
            staticWorldW = GRID_COLS * HEX_RADIUS * Math.sqrt(3) + HEX_RADIUS * 2;
            staticWorldH = GRID_ROWS * HEX_RADIUS * 1.5 + HEX_RADIUS * 2;

            const W = Math.ceil(staticWorldW * STATIC_SSAA);
            const H = Math.ceil(staticWorldH * STATIC_SSAA);
            if (staticCanvas.width !== W || staticCanvas.height !== H) {
                staticCanvas.width = W;
                staticCanvas.height = H;
            }

            const g = staticCtx;
            g.setTransform(1, 0, 0, 1, 0, 0);
            g.clearRect(0, 0, W, H);
            g.setTransform(STATIC_SSAA, 0, 0, STATIC_SSAA, 0, 0);

            // Малюємо легку і стильну сітку каменю
            g.strokeStyle = '#1b263b';
            g.lineWidth = 1.5;
            for (let r = 0; r < GRID_ROWS; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    const { x, y } = hexToPixel(r, c);
                    pathHex(g, x, y, HEX_RADIUS);
                    g.stroke();
                }
            }
        }

        // ===== УПРАВЛІННЯ В'ЮПОРТОМ (Пан та зум) =====
        function setupViewportControls() {
            const viewport = document.getElementById('hex-grid-viewport');
            if (!viewport || viewport._controlsSetup) return;
            viewport._controlsSetup = true;

            const clampScale = (s) => Math.min(Math.max(0.15, s), 2.5);

            viewport.addEventListener('wheel', (e) => {
                e.preventDefault();
                const rect = viewport.getBoundingClientRect();
                const mx = e.clientX - rect.left, my = e.clientY - rect.top;
                const oldScale = scale;
                const ns = clampScale(scale * (e.deltaY < 0 ? 1.08 : 0.92));
                panX = mx - (mx - panX) * (ns / oldScale);
                panY = my - (my - panY) * (ns / oldScale);
                scale = ns;
                scheduleRender();
            }, { passive: false });

            viewport.addEventListener('pointerdown', (e) => {
                viewport.setPointerCapture(e.pointerId);
                isDragging = true;
                dragStartX = e.clientX - panX;
                dragStartY = e.clientY - panY;
            });

            viewport.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                panX = e.clientX - dragStartX;
                panY = e.clientY - dragStartY;
                scheduleRender();
            });

            const endPointer = (e) => { isDragging = false; };
            viewport.addEventListener('pointerup', endPointer);
            viewport.addEventListener('pointercancel', endPointer);
        }

        window.zoomIn = function() { scale = Math.min(2.5, scale * 1.2); scheduleRender(); }
        window.zoomOut = function() { scale = Math.max(0.15, scale / 1.2); scheduleRender(); }
        // ===== ІНІЦІАЛІЗАЦІЯ ПРИ ЗАВАНТАЖЕННІ =====
        window.addEventListener('load', () => {
            setTimeout(() => { hideLoader(); }, 800);

            window.addEventListener('beforeunload', () => {
                if (currentUsername) {
                    try { update(ref(db, `users/${currentUsername}`), { lastOnline: Date.now() }); } catch (e) {}
                }
            });
        });
    </script>
</body>
</html>
